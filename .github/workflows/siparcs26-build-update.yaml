name: SIPARCS-26 Container Build and Helm chart update

on:
  push:
    branches:
      - siparcs26/*
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      #- "app-chart/**"
  workflow_dispatch:

jobs:
  container-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.SIPARCS26_HARBOR_USERNAME }}
          password: ${{ secrets.SIPARCS26_HARBOR_PASSWORD }}
          registry: hub.k8s.ucar.edu/siparcs26-gdex
      - name: Try to get the current version number from the running webserver
        run: echo "VERSION_NUMBER=$(curl -s --max-time 10 -o - 'https://gdex.k8s.ucar.edu/static/version')" >> $GITHUB_ENV
      - name: If the webserver is unavailable, pull the latest image from docker
        if: ${{ env.VERSION_NUMBER == '' }}
        run: |
          docker pull dattore/gdex-web-portal:latest
          echo "VERSION_NUMBER=$(docker run dattore/gdex-web-portal /bin/bash -c '/usr/local/bin/get_version_number')" >> $GITHUB_ENV
            #      - name: Increment the version number
            #        run: echo "VERSION_NUMBER=$(($VERSION_NUMBER+1))" >> $GITHUB_ENV
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} 
          ssh-key: ${{ secrets.ACTIONS_PUSH_KEY }}
      - name: Build a new version of container
        run: >
          docker build --platform linux/amd64
          --build-arg VERSION_NUMBER=$VERSION_NUMBER
          -t hub.k8s.ucar.edu/siparcs26-gdex/gdex-web-portal:v${{ github.run_id }}
          --no-cache -f Dockerfile.riley . 
      - name: Push the new image to Harbor
        run: |
          git branch
          docker push hub.k8s.ucar.edu/siparcs26-gdex/gdex-web-portal:v${{ github.run_id }}
          docker tag hub.k8s.ucar.edu/siparcs26-gdex/gdex-web-portal:v${{ github.run_id }} hub.k8s.ucar.edu/siparcs26-gdex/gdex-web-portal:latest
          docker push hub.k8s.ucar.edu/siparcs26-gdex/gdex-web-portal:latest
      - name: Update the Helm chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i -E "/image/s/gdex-web-portal:(.){1,}/gdex-web-portal:v${{ github.run_id }}/" app-chart/values.yaml.siparcs26
          git add app-chart/values.yaml.siparcs26
          git commit -m "SIParCS26 Build successful: Update siparcs26-gdex image to v${{ github.run_id }}"
          git push
