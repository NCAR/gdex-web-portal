on:
  push:
    branches:
      - calie/*
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      - "app-chart/**"

jobs:
  container-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.CALIE_HARBOR_USERNAME }}
          password: ${{ secrets.CALIE_HARBOR_PASSWORD }}
          registry: hub.k8s.ucar.edu/calie-gdex
      - name: Try to get the current version number from the running webserver
        run: echo "VERSION_NUMBER=$(curl -s --max-time 10 -o - 'https://gdex.k8s.ucar.edu/static/version')" >> $GITHUB_ENV
      - name: If the webserver is unavailable, pull the latest image from docker
        if: ${{ env.VERSION_NUMBER == '' }}
        run: |
          docker pull dattore/gdex-web-portal:latest
          echo "VERSION_NUMBER=$(docker run dattore/gdex-web-portal /bin/bash -c '/usr/local/bin/get_version_number')" >> $GITHUB_ENV
            #      - name: Increment the version number
            #        run: echo "VERSION_NUMBER=$(($VERSION_NUMBER+1))" >> $GITHUB_ENV
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }} 
          ssh-key: ${{ secrets.ACTIONS_PUSH_KEY }}
      - name: Build a new version of container
        run: >
          docker build --platform linux/amd64
          --build-arg VERSION_NUMBER=$VERSION_NUMBER
          -t hub.k8s.ucar.edu/calie-gdex/gdex-web-portal:v${{ github.run_id }}
          --no-cache .
      - name: Push the new image to Harbor
        run: |
          git branch
          docker push hub.k8s.ucar.edu/calie-gdex/gdex-web-portal:v${{ github.run_id }}
          docker tag hub.k8s.ucar.edu/calie-gdex/gdex-web-portal:v${{ github.run_id }} hub.k8s.ucar.edu/calie-gdex/gdex-web-portal:latest
          docker push hub.k8s.ucar.edu/calie-gdex/gdex-web-portal:latest

          #
          ##
          # Just use :latest tag
          # No need to increment version
