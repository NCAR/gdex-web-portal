on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: "Name of test branch"
        required: true

jobs:
  test-container-rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Build a new version of container
        run: >
          docker build --platform linux/amd64
          --build-arg VERSION_NUMBER=${{ github.ref_name }}
          -t dattore/gdex-web-portal:${{ github.ref_name }}
          --no-cache -f Dockerfile.bob .
      - name: Push the new image to Docker Hub
        run: docker push dattore/gdex-web-portal:${{ github.ref_name }}
