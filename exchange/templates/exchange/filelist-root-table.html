{% comment %}
Root exchange listing — each entry is a top-level dataset/project directory.
No size column; no checkboxes.
{% endcomment %}
<table class="table table-sm table-hover exchange-table">
    <thead class="table-light">
        <tr>
            <th scope="col">Project</th>
            <th scope="col">Modified</th>
        </tr>
    </thead>
    <tbody>
        {% for entry in entries %}
        <tr data-is-dir="true" data-name="{{ entry.name|lower }}">
            <td>
                <i class="fas fa-folder text-warning me-2"></i>
                <a href="/exchange/{{ entry.subpath }}/">{{ entry.name }}</a>
            </td>
            <td class="text-muted small">{{ entry.modtime|date:"Y-m-d H:i" }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
