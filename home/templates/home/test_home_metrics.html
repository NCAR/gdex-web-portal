{% load static %}

<!-- METRICS -->
<section class="gdex-metrics-section">
    <div class="container-lg">

        <h2 class="gdex-metrics-section__title">GDEX By the Metrics</h2>

        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-6 g-4">
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-data-software-services"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-datasets">&hellip;</div>
                    <div class="gdex-metric__label">Total Datasets</div>
                </div>
            </div>
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-documents"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-citations">&hellip;</div>
                    <div class="gdex-metric__label">Total Citations</div>
                </div>
            </div>
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-our-staff"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-users">&hellip;</div>
                    <div class="gdex-metric__label">Unique IPs</div>
                </div>
            </div>
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-observations"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-downloaded">&hellip;</div>
                    <div class="gdex-metric__label">Data Downloaded</div>
                </div>
            </div>
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-computational-resources"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-volume">&hellip;</div>
                    <div class="gdex-metric__label">Size of GDEX</div>
                </div>
            </div>
            <div class="col">
                <div class="gdex-metric">
                    <div class="gdex-metric__icon"><i class="icon-what-we-offer"></i></div>
                    <div class="gdex-metric__value" id="gdex-metric-requests">&hellip;</div>
                    <div class="gdex-metric__label">Customized Requests</div>
                </div>
            </div>
        </div>

    </div>
</section>

<script>
(function () {
    function fmt(n) { return Number(n).toLocaleString(); }

    function countUp(el, target, suffix, isFloat) {
        var duration = 1800;
        var startTime = null;
        suffix = suffix || '';
        function step(ts) {
            if (!startTime) startTime = ts;
            var progress = Math.min((ts - startTime) / duration, 1);
            var eased = 1 - Math.pow(1 - progress, 3);
            var current = target * eased;
            el.textContent = isFloat
                ? current.toFixed(2) + suffix
                : fmt(Math.floor(current)) + suffix;
            if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }

    function fetchMetric(url, id, getValue, suffix, isFloat) {
        fetch(url)
            .then(function (r) { return r.json(); })
            .then(function (data) {
                var el = document.getElementById(id);
                if (!el) return;
                var target = parseFloat(getValue(data));
                if (isNaN(target)) { el.textContent = '—'; return; }
                countUp(el, target, suffix, isFloat);
            })
            .catch(function () {
                var el = document.getElementById(id);
                if (el) el.textContent = '—';
            });
    }

    fetchMetric('{% url "total_datasets" %}',    'gdex-metric-datasets',   function (d) { return d.value; });
    fetchMetric('{% url "total_citations" %}',   'gdex-metric-citations',  function (d) { return d.value; });
    fetchMetric('{% url "unique_users" %}',      'gdex-metric-users',      function (d) { return d.ips; });
    fetchMetric('{% url "volume_downloaded" %}', 'gdex-metric-downloaded', function (d) { return d.volume; }, ' PB', true);
    fetchMetric('{% url "gdex_volume" %}',       'gdex-metric-volume',     function (d) { return d.value; }, ' PB', true);
    fetchMetric('{% url "total_requests" %}',    'gdex-metric-requests',   function (d) { return d.value; });
}());
</script>
