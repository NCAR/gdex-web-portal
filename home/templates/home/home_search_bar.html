<!-- SEARCH OUTER — negative margin overlaps the hero -->
<div class="gdex-search-outer">
    <div class="container-lg">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="gdex-search-block">
                    <h2 class="gdex-search-block__title" id="gdex-search-block-title">{{ page.search_box_title|default:"Search For Datasets" }}</h2>
                    <form action="{% url 'dataset_search' index='dataset-search' %}" method="get" id="gdex-home-search-form" role="search" aria-labelledby="gdex-search-block-title">
                        <div class="gdex-search-bar">
                            <input
                                type="text"
                                name="q"
                                id="gdex-home-search-input"
                                class="gdex-search-bar__input"
                                placeholder="{{ page.search_box_placeholder|default:"Search by keyword or dataset number" }}"
                                aria-label="Search datasets"
                            >
                            <button type="submit" class="gdex-search-bar__btn" aria-label="Search">
                                <i class="fas fa-search" aria-hidden="true"></i>
                                <span>Search</span>
                            </button>
                        </div>
                    </form>
                    <script>
                        document.getElementById('gdex-home-search-form').addEventListener('submit', function (e) {
                            if (!document.getElementById('gdex-home-search-input').value.trim()) {
                                e.preventDefault();
                            }
                        });
                        window.addEventListener('pageshow', function () {
                            document.getElementById('gdex-home-search-input').value = '';
                        });
                    </script>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CHIPS -->
<div class="gdex-search-chips">
    <div class="container-lg">
        <p class="gdex-search-chips__label" id="gdex-search-chips-label">Explore specialized datasets</p>
        <div class="d-flex flex-wrap gap-3 justify-content-center" role="group" aria-labelledby="gdex-search-chips-label">
            {% for suggestion in page.search_suggestions.all %}
            <a href="{{ suggestion.search_term_url }}" class="gdex-chip">
                <div class="gdex-chip__icon-zone">
                    <i class="{{ suggestion.icon }}" aria-hidden="true"></i>
                </div>
                <div class="gdex-chip__text-zone">
                    <strong>{{ suggestion.search_term }}</strong>
                    <small class="d-block">{{ suggestion.description }}</small>
                </div>
            </a>
            {% endfor %}
        </div>
    </div>
</div>
