{% extends "datasubmit/submission_portal/my_datasets/my_dataset_base.html" %}

{% block dataset_content %}
<div class="card rounded-4 mb-3">
    <div class="card-header"><h3 class="h5 mb-0">Dataset Metadata</h3></div>
    <div class="card-body">
        <div class="row summary-row">
            <div class="col-sm-4 summary-label">Abstract</div>
            <div class="col-sm-8 summary-value">{{ pre_submission.dataset_abstract|default:"—" }}</div>
        </div>
        <div class="row summary-row">
            <div class="col-sm-4 summary-label">Additional Details</div>
            <div class="col-sm-8 summary-value">{{ pre_submission.dataset_details|default:"—" }}</div>
        </div>

    </div>
</div>
{% endblock %}
