{% load wagtailcore_tags %}

<style>
.grid-card-group {
    border: 2px solid #236892;           /* blue border */
    border-radius: 20px;                 /* 20px corners */
    background-color: rgba(255,255,255,.7); /* slightly transparent white */
    box-shadow: 0px 0px 10px lightgray;
    position: relative;                  /* required for stretched-link */
    transition: background-color .2s ease, box-shadow .2s ease;
}

/* Hover effect for entire card */
.grid-card-group:hover {
    background-color: rgba(255,255,255,.9); /* slightly brighter on hover */
    cursor: pointer;                        /* entire card looks clickable */
    box-shadow: 0px 0px 14px #b3c9d6;
}

/* Remove cursor override on card text */
.grid-card-group .card-title,
.grid-card-group .card-text {
    color: black;
    text-decoration: none;
}

/* Remove underline on hover, keep clickable feel */
.grid-card-group .card-title:hover,
.grid-card-group .card-text:hover {
    text-decoration: none;
}
/* Disable hover + click for a specific card */
.no-click {
    pointer-events: none;            /* nothing inside is clickable */
    cursor: default !important;      /* arrow cursor */
}

.no-click:hover {
    background-color: rgba(255,255,255,.7) !important;  /* no hover change */
    box-shadow: 0px 0px 10px lightgray !important;       /* no hover shadow */
}

/* Style for the numbered buttons */
.btn-rounded-number {
    width: 70px;
    height: 70px;
    background-color: #0057C2;
    border-color: #0057C2;
    display: flex;
    align-items: center;
    justify-content: center;
}
.btn-rounded-number i {
    color: white;
    font-size: 30px;
    font-weight: bold;
}
</style>
<div class="component featured-work container-lg pt-md-4">
    <div class="row gx-0 justify-content-center">
        <div class="col-10">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-2 g-md-4">

                <!-- Card 1 -->
                <div class="col">
                    <div class="card h-100 grid-card-group">
                        <a href="{% slugurl 'submit-data-request' %}" class="stretched-link"></a>
                        <div class="card-body text-center">
                            <div class="icon py-2">
                                <!-- Round inactive button with icon -->
                                <button class="btn btn-primary btn-rounded-number rounded-circle disabled mx-auto mb-2">
                                    <i class="fa-solid fa-1"></i>
                                </button>
                            </div>
                            <h4 class="my-card-title text-black" style="font-size: 28px; font-weight: 700;">Submit Data</h4>
                            <p class="card-text pt-2" style="font-size: 22px;">
                                Share basic details about your dataset using a short online form.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Card 2 -->
<div class="col">
    <div class="card h-100 grid-card-group">
        <a href="{% slugurl 'gdex-dataset-submission-appraisal-and-selection-process' %}" class="stretched-link"></a>
        <div class="card-body text-center">
            <div class="icon py-2">
                <!-- Round inactive button with icon -->
                <button class="btn btn-primary btn-rounded-number rounded-circle disabled mx-auto mb-2">
                    <i class="fa-solid fa-2"></i>
                </button>
            </div>
            <h4 class="my-card-title text-black" style="font-size: 28px; font-weight: 700;">Review Process</h4>
            <p class="card-text pt-2" style="font-size:22px;">
                NCAR employee reviews take about 30 minutes; external reviews may take up to one week.
            </p>
                        </div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="col">
                    <div class="card h-100 grid-card-group no-click">
                        <div class="card-body text-center">
                            <div class="icon py-2">
                                <!-- Round inactive button with icon -->
                                <button class="btn btn-primary btn-rounded-number rounded-circle disabled mx-auto mb-2">
                                    <i class="fa-solid fa-3"></i>
                                </button>
                            </div>
                            <h4 class="my-card-title text-black" style="font-size: 28px; font-weight: bold;" >
                                Final Decision </h4>
                            <p class="card-text pt-2" style="font-size: 22px;">
                                You'll get an email once your submission is approved or rejected.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
