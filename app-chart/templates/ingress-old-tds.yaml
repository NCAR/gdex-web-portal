{{- if .Values.webapp.ingress.oldtdsRedirect }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-old-tds
  namespace: {{ .Release.Namespace }}
  labels:
    group: {{ .Values.webapp.group }}
  annotations:
    cert-manager.io/cluster-issuer: "incommon"
    nginx.ingress.kubernetes.io/permanent-redirect: "https://gdex.ucar.edu"
spec:
  ingressClassName: nginx-external
  tls:
    - hosts:
      - tds2.k8s.ucar.edu
      - tds.ucar.edu
      secretName: incommon-cert.tds2.k8s.ucar.edu
  rules:
  - host: tds2.k8s.ucar.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-dummy
            port:
              number: 80
  - host: tds.ucar.edu
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: service-dummy
            port:
              number: 80
{{- end }}