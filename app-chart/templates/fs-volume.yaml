{{- if and .Values.volume.enabled (not .Values.volume.fs.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.volume.fs.name }}
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: cephfs
  resources:
    requests:
      storage: {{ .Values.volume.fs.size | default "1Gi" }} 
{{- end }}