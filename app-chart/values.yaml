replicaCount: 1

webapp:
  name: gdex-webserver
  group: gdex-web
  path: /
  tls:
    fqdn: gdex.k8s.ucar.edu
    secretName: incommon-cert-gdex-webserver
  container: 
    image: docker.io/dattore/gdex-web-portal:v73
    port: 8080
    requests:
      memory: 64Gi
      cpu: 4
    limits:
      memory: 128Gi
      cpu: 8
    responseTimeout: 120s
    maxUploadSize: 30M

volume:
  fs:
    name: gdexdata
    size: 55Gi
    mountPath: /data
  glade:
    name: glade-campaign
    server: gladedm1.ucar.edu
    path: /gpfs/csfs1
    mountPath: /glade/campaign
    readOnly: true
