replicaCount: 1

webapp:
  name: gdex-webserver
  group: gdex-web
  path: /
  tls:
    fqdn: gdex.k8s.ucar.edu
    fqdnGDEX: gdex.ucar.edu
    fqdnAPI: api.gdex.ucar.edu
    secretName: incommon-cert-gdex-webserver
  container: 
    image: docker.io/dattore/gdex-web-portal:v464
    port: 8080
    requests:
      memory: 32Gi
      cpu: 4
    limits:
      memory: 128Gi
      cpu: 6
    responseTimeout: 180
    maxUploadSize: 60m
  ingress:
    ingressClassName: nginx-external

volume:
  fs:
    name: gdexdata
    size: 2Ti
    mountPath: /data

backup:
  enabled: true                          
  prefix: gdex-web-data                   # destination prefix in s3://gdex/
  schedule: "17 2 * * *"                  # cron schedule (UTC)
  image: docker.io/rclone/rclone:1.74
  endpoint: https://boreas.hpc.ucar.edu:6443
  bucket: gdex
  credentialsSecret: backup-s3-creds
  logLevel: NOTICE                        # NOTICE | INFO | DEBUG
  rclone:
    transfers: 8
    checkers: 16
    chunkSizeMB: 64
    uploadConcurrency: 4
    extraFlags: []                        # e.g. ["--exclude", "*.tmp"]
  runAsUser: 33                           # match PVC ownership