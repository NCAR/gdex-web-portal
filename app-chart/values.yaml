replicaCount: 1

app:
  name: gdex-webserver
  group: gdex-web
  path: /
  tls:
    fqdn: gdex.k8s.ucar.edu
    secretName: incommon-cert-gdex-web-test
  container: 
    image: docker.io/dattore/gdex-web-portal:v160
    port: 443
    memory: 1G
    cpu: 2

volume:
  fs:
    name: gdexdata
    size: 55Gi
    mountPath: /data
  glade:
    name: glade-campaign
    server: gladedm1.ucar.edu
    path: /gpfs/csfs1
    mountPath: /glade/campaign
    readOnly: true
