replicaCount: 1

webapp:
  name: gdex-webserver
  group: gdex-web
  path: /
  ingressClassName: nginx-external
  tls:
    fqdn: gdex.k8s.ucar.edu
    fqdnGDEX: gdex.ucar.edu
    fqdnAPI: api.gdex.ucar.edu
    secretName: incommon-cert-gdex-webserver
  container: 
    image: docker.io/dattore/gdex-web-portal:v289
    port: 8080
    requests:
      memory: 4Gi
      cpu: 1
    limits:
      memory: 16Gi
      cpu: 6
    responseTimeout: 180
    maxUploadSize: 60m
  ingress:
    ingressClassName: nginx-external
    oldrdaRedirect: true
    oldesgRedirect: true
    oldrdaRedirect: true
    oldtdsRedirect: true

volume:
  fs:
    name: gdexdata
    size: 2Ti
    mountPath: /data
    readonly: false
