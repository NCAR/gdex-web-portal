<hr class="my-1">
<div class="pb-2" id="filter_search">
    <div><strong>File name filter</strong></div>
    <div><em>Enter a case-sensitive file name pattern to filter this file list.</em></div>
    <input type="text" id="filterwfile" class='form-control' placeholder="Enter a filter string" name="filter_wfile"{% if data.filter_wfile %} value="{{data.filter_wfile}}"{% endif %}>
    <button class="btn btn-primary my-2 rounded" style="font-size:1rem" id="applyFilters">Apply filter</button>
    <button class="btn btn-outline-primary my-2 rounded" style="font-size:1rem" id="clearFilters">Clear filter</button>
</div>
{% if group.gindex != 0 %}
    {% url 'dataset_filelist_filtered' data.dsid group.gindex as filelist_base_url %}
{% else %}
    {% url 'dataset_filelist' data.dsid as filelist_base_url %}
{% endif %}
<script>
$("#applyFilters").on("click", function() {
    url='{{ filelist_base_url }}?filter_wfile='+encodeURIComponent($("#filterwfile").val());
    $.get(url, function(d) {
        replace_ds_content(d);
    });
})
$("#clearFilters").on("click", function() {
    $("input[id^='filter']").val("");
    url='{{ filelist_base_url }}';
    $.get(url, function(d) {
        replace_ds_content(d);
    });
})
</script>
