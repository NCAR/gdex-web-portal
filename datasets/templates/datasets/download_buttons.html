{% load wagtailcore_tags custom_tags home_tags static %}
<div class="my-2 d-flex flex-wrap align-items-center gap-2">
    <div class="dropdown">
        <button class="btn btn-primary btn-gdex p-1 dropdown-toggle" type="button" id="{% if group %}{{ group.group_id|slugify }}_{% endif %}download_script_dropdown" data-bs-toggle="dropdown" aria-expanded="false">Download Script</button>
        <ul class="dropdown-menu" aria-labelledby="{% if group %}{{ group.group_id|slugify }}_{% endif %}download_script_dropdown">
            <li><button class="dropdown-item" type="button" onclick="getScript('csh')">Csh Download Script</button></li>
            <li><button class="dropdown-item" type="button" onclick="getScript('python')">Python Download Script</button></li>
            <li><button class="dropdown-item" type="button" onclick="getScript('jupyter')">Jupyter Notebook Download Script</button></li>
        </ul>
    </div>
    {% if globus_url %}
        <a href="{{ globus_url }}" class="btn btn-primary btn-gdex" style="font-size:1rem">Globus Transfer</a>
    {% else %}
        <button class="btn btn-primary btn-gdex" style="font-size:1rem" onclick=showGlobusConfirmation()>Globus download</button>
    {% endif %}
</div>
