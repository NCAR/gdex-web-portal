{% load wagtailcore_tags custom_tags home_tags static %}
<div class="mt-1 mb-1 d-flex flex-wrap align-items-center gap-2">
    <div class="dropdown">
        <button class="btn btn-primary p-1 rounded dropdown-toggle" style="font-size:1rem" type="button" id="download_script_dropdown" data-bs-toggle="dropdown" aria-expanded="false">Download Script</button>
        <ul class="dropdown-menu" aria-labelledby="download_script_dropdown">
            <li><button class="dropdown-item" type="button" onclick="getScript('csh')" id="csh_download">Csh Download Script</button></li>
            <li><button class="dropdown-item" type="button" onclick="getScript('python')" id="python_download">Python Download Script</button></li>
            <li><button class="dropdown-item" type="button" onclick="getScript('jupyter')" id="jupyter_download">Jupyter Notebook Download Script</button></li>
        </ul>
    </div>
    {% if globus_url %}
        <a href="{{ globus_url }}" class="btn btn-primary p-1 rounded" role="button" style="font-size:1rem">Globus Transfer</a>
    {% else %}
        <button class="btn btn-primary p-1 rounded" style="font-size:1rem" onclick=showGlobusConfirmation() id="globus_download">Globus download</button>
    {% endif %}
</div>
