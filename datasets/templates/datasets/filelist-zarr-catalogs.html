<input type='hidden' id=clipboard></input>
<div id='arco-container' class='container mt-4 mb-4'>
    <table id="zarr-catalogs-table" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th scope="col">Catalog Name</th>
                <th scope="col">Access</th>
                <th scope="note">Note</th>
            </tr>
        </thead>
        <tbody>
            {% for arco_file in arco_files %}
                {% if arco_file.data_format != 'csv' %}
                    <tr>
                        <td class="roboto-regular" style="font-family: Roboto Mono;">{{ arco_file.file_name }}</td>
                        <td>
                            <button class="btn btn-primary px-2 py-1 rounded" 
                                type="button" 
                                style="transition: all 0.2s ease; font-size: 1rem;" 
                                onClick="copyFullLink(this, '{{ arco_file.file_url }}', 'Copy Full {% if 'http' in arco_file.file_url %} URL {% else %} Path {% endif %}')">
                                <i class="fa-solid fa-copy pe-1"></i>
                                Copy Full {% if 'http' in arco_file.file_url %} URL {% else %} Path {% endif %}

                            </button>
                        </td>
                        <td>{% if arco_file.file_note %}<i class="fa-solid fa-circle-info pe-1"></i>{{ arco_file.file_note }}{% endif %}</td>
                    </tr>
                {% endif %}
            {% endfor %}
        </tbody>
    </table>
</div>
