<input type='hidden' id=clipboard></input>
<div id='arco-container' class='container mt-4 mb-4'>
    <table id="zarr-catalogs-table" class="table table-striped table-bordered">
        <thead>
            <tr>
                <th scope="col">Catalog Name</th>
                <th scope="col">Access</th>
                <th scope="note">Note</th>
            </tr>
        </thead>
        <tbody>
            {% for row in data.groups.0.rows %}
                {% get_file_from_row row as zarr_file %}
                {% if zarr_file.data_format != 'csv' %}
                    <tr>
                        <td class="roboto-regular" style="font-family: Roboto Mono;">{{ zarr_file.file_name }}</td>
                        <td>
                            <button class="btn btn-primary px-2 py-1 rounded" 
                                    type="button" 
                                    style="transition: all 0.2s ease; font-size: 1rem;" 
                                    onClick="copyFullLink(this, '{{ zarr_file.file_url }}', 'Copy Full URL')">
                                <i class="fa-solid fa-copy pe-1"></i>
                                Copy Full URL
                            </button>
                        </td>
                        <td>{% if zarr_file.file_note %}<i class="fa-solid fa-circle-info pe-1"></i>{{ zarr_file.file_note }}</td>
                    </tr>
                {% endif %}
            {% endfor %}
        </tbody>
    </table>
</div>
